[package]
name = "bson-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VGI worker exposing BSON decode / Extended-JSON / typed-field functions to DuckDB over Apache Arrow"

[lib]
name = "bson_worker"
path = "src/lib.rs"

[[bin]]
name = "bson-worker"
path = "src/main.rs"

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
bson-core.workspace = true
# Used directly by the encode path (value_in.rs) to build a `bson::Document` from
# Arrow cells. Same version the core crate resolves, so no duplicate-tree concern.
bson = { version = "3.1.0", default-features = false, features = ["compat-3-0-0", "serde", "serde_json-1"] }
log = "0.4"
# Local-filesystem glob expansion for `mongodump_read`.
glob = "0.3"

# --- Native ---------------------------------------------------------------
# The SDK's HTTP transport plus the HTTP RPC codec and env_logger. The SDK's
# `sqlite` feature (bundled C SQLite, the default shared-storage backend) is
# deliberately left off: every function here is a stateless BLOB transform, so
# the SDK's dependency-free filesystem store (`FsStorage`) covers the little
# cross-process state the transport needs, and the worker no longer ships a
# bundled SQLite (RUSTSEC-2026-0459 affects libsqlite3-sys 0.37, which the
# SDK's rusqlite 0.39 pins).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vgi = { workspace = true, features = ["transport-http"] }
vgi-rpc = { workspace = true, features = ["http"] }
env_logger = "0.11"

# --- wasm32 ---------------------------------------------------------------
# No sqlite (C) and no HTTP transport (tokio/mio/axum); the bincode stream codec
# is what the SAB byte-channel transport needs. No env_logger.
[target.'cfg(target_arch = "wasm32")'.dependencies]
vgi = { workspace = true }
vgi-rpc = { workspace = true, features = ["stream-codec"] }

[dev-dependencies]
bson-core = { workspace = true }
