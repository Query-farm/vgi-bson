# vgi-lint-check configuration for vgi-bson.
#
# Scalar/table examples use local fixtures or in-engine transforms over a BLOB
# (no network). COPY uses local files and execution-scoped staging; its SQL
# behavior is covered by test/sql/copy.test. The linter's execution rules
# (VGI9xx) CAN run the scalar/table examples against the attached worker. We
# therefore keep execution ENABLED and gate the whole suite — static metadata and
# executable examples alike — at `info`.
#
# The catalog `source_url` (-> the GitHub repo), the per-object titles, doc_llm /
# doc_md, keywords, per-arg docs, and example_queries are emitted from the
# worker's FunctionMetadata (see crates/bson-worker/src/**), which the linter
# reads over VGI.
[tool.vgi-lint-check]
select = ["ALL"]
ignore = []
fail_on = "info"

